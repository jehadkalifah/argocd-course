apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jehadkalifah/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
    helm:
      # valuesObject:
      #   # Tells the Helm chart to use guestbook-ui as the full name of the Kubernetes resources it creates, instead of generating a name based on the Helm release/chart name
      #   fullnameOverride: guestbook-ui
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
